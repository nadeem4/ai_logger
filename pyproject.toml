[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "AI-powered log analysis for Python logging: batch, scrub PII, and route logs to an LLM for insights."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Nadeem Khan", email = "nadeem4.nk13@gmail.com"}]
keywords = ["logging", "ai", "llm", "observability", "pii", "prometheus", "openai", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: System :: Logging",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "Jinja2>=3.0,<4",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
metrics = ["prometheus-client>=0.19"]
local = ["transformers>=4.30", "torch>=2.0"]
all = ["loglens[openai,anthropic,metrics]"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "build", "loglens[all]"]

[project.urls]
Homepage = "https://github.com/nadeem4/loglens"
Issues = "https://github.com/nadeem4/loglens/issues"
Changelog = "https://github.com/nadeem4/loglens/blob/main/CHANGELOG.md"

[project.scripts]
loglens-check = "loglens.cli.health_check:main"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.setuptools.package-data]
loglens = ["templates/*.jinja2", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
