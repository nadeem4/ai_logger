[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "AI-powered log analysis for Python logging: batch, scrub PII, and route logs to an LLM for insights."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nadeem Khan", email = "nadeem4.nk13@gmail.com"}]
keywords = ["logging", "ai", "llm", "observability", "pii", "prometheus", "openai", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: System :: Logging",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.12,<3",
  "Jinja2>=3.0,<4",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
metrics = ["prometheus-client>=0.19"]
local = ["transformers>=4.30", "torch>=2.0"]
all = ["loglens[openai,anthropic,metrics]"]
dev = ["pytest>=8", "pytest-cov", "ruff==0.16.5", "mypy==2.3.1", "build", "pre-commit", "loglens[all]"]

[project.urls]
Homepage = "https://github.com/nadeem4/loglens"
Issues = "https://github.com/nadeem4/loglens/issues"
Changelog = "https://github.com/nadeem4/loglens/blob/main/CHANGELOG.md"

[project.scripts]
loglens-check = "loglens.cli.health_check:main"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.setuptools.package-data]
loglens = ["templates/*.jinja2", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
# ruff format's markdown support reformats fenced Python code blocks in-place;
# exclude all Markdown from formatting so prose/example code samples stay
# exactly as written (docs/PRIVACY.md's fences are illustrative and were
# reformatted by `ruff format` before this exclusion was broadened from just
# README.md -- a formatter silently "fixing" a documentation example can make
# it wrong). Linting (`ruff check`) never applied to Markdown, so this only
# affects `ruff format`.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
# Matches requires-python's floor.
python_version = "3.10"
ignore_missing_imports = true
