[build-system]
requires = ["setuptools>=61.0"] # Minimum version of setuptools needed
build-backend = "setuptools.build_meta"
backend-path = ["."] # Specifies that setuptools.build_meta is in the current directory or importable

[project]
name = "ai_logging"
version = "0.1.0" # Keep this in sync with __init__.py and setup.py
description = "Python logging toolkit with AI-powered analysis and intelligent routing."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT License"} # Or e.g., {file = "LICENSE.txt"}
authors = [
    {name = "Nadeem Khan", email = "contact@example.com"}, # Replace with actual author details
]
keywords = ["logging", "ai", "llm", "gpt", "langchain", "monitoring", "pii", "prometheus"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# Dependencies can be listed here as well, complementing or replacing install_requires in setup.py
# For projects using only pyproject.toml for packaging, this is the primary place for dependencies.
# Since we have setup.py and requirements.txt, we'll keep dependencies there for now
# to maintain compatibility with older pip versions or workflows that rely on setup.py.
# If you were to list them here:
# dependencies = [
#   "pydantic>=2.0.0,<3.0.0",
#   "pydantic-settings>=2.0.0,<3.0.0",
#   "Jinja2>=3.0.0,<4.0.0",
#   "prometheus-client>=0.19.0,<0.21.0",
#   # "openai>=1.0.0,<2.0.0", # etc.
# ]

[project.urls] # Optional
"Homepage" = "https://github.com/yourusername/ai_logging" # Replace
"Bug Reports" = "https://github.com/yourusername/ai_logging/issues" # Replace
"Source Code" = "https://github.com/yourusername/ai_logging" # Replace

[project.scripts] # Defines console scripts
ai-logging-health-check = "ai_logging.cli.health_check:main"

